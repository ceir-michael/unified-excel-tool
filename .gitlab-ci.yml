stages:
  - build

default:
  interruptible: true

.build_template:
  stage: build
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: "pip-$CI_JOB_NAME"
    paths:
      - .cache/pip/
  artifacts:
    name: "UnifiedExcelTools-$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 30 days

build:linux:
  extends: .build_template
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-build.txt
  script:
    - python -m PyInstaller --clean build/UnifiedExcelTools.spec

build:windows:
  extends: .build_template
  tags:
    - windows
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-build.txt
  script:
    - python -m PyInstaller --clean build/UnifiedExcelTools.spec

build:macos:
  extends: .build_template
  tags:
    - macos
  before_script:
    - python3 -m pip install --upgrade pip
    - python3 -m pip install -r requirements-build.txt
  script:
    - python3 -m PyInstaller --clean build/UnifiedExcelTools.spec
